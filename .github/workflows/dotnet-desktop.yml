name: .NET Desktop Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest

    env:
      Solution_Name: TextToSpeech.sln   # Replace with your solution name

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        lfs: true   # tessdata/*.traineddata are Git LFS files; the build needs the real bytes

    # Install the .NET Core
    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'  # Specify your .NET version

    # Add MSBuild to the PATH
    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2
          
    # Restore NuGet packages
    - name: Restore NuGet packages
      run: dotnet restore $env:Solution_Name

    # Build the solution
    - name: Build the application
      run: msbuild $env:Solution_Name /p:Configuration=Release

    # Run the unit tests. Core, filter and API tests need no UI; Windows.Tests skips the
    # LocalOnly ones (they speak aloud or need voices downloaded on a dev PC).
    - name: Test
      run: |
        dotnet test TextToSpeech.Core.Tests/TextToSpeech.Core.Tests.csproj --configuration Release
        dotnet test TextToSpeech.Tests/TextToSpeech.Tests.csproj --configuration Release
        dotnet test TextToSpeech.Api.Tests/TextToSpeech.Api.Tests.csproj --configuration Release
        dotnet test TextToSpeech.Windows.Tests/TextToSpeech.Windows.Tests.csproj --configuration Release --filter "Category!=LocalOnly"

    # The standalone rule engine has its own tests
    - name: Test PlainRules
      run: dotnet test PlainRules/PlainRules.sln --configuration Release

    # Node client, CLI, MCP server and the Claude Code plugin
    - name: Test Node integrations
      run: node --test integrations/test/integration.test.mjs plugins/tts/test/plugin.test.mjs

    # Upload only the app (not every test and library output)
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TextToSpeech-app
        path: TextToSpeech/bin/Release/
        if-no-files-found: error
