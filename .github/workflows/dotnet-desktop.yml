name: .NET Desktop Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest

    env:
      Solution_Name: TextToSpeech.sln   # Replace with your solution name

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Install the .NET Core
    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'  # Specify your .NET version

    # Add MSBuild to the PATH
    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2
          
    # Restore NuGet packages
    - name: Restore NuGet packages
      run: dotnet restore $env:Solution_Name

    # Build the solution
    - name: Build the application
      run: msbuild $env:Solution_Name /p:Configuration=Release

    # Run the UI-free unit tests
    - name: Test
      run: dotnet test TextToSpeech.Core.Tests/TextToSpeech.Core.Tests.csproj --configuration Release

    # The standalone rule engine has its own tests
    - name: Test PlainRules
      run: dotnet test PlainRules/PlainRules.sln --configuration Release

    # Upload build artifacts (the built executable files)
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Executable Files
        path: |
          **\bin\Release\**\*.exe
          **\bin\Release\**\*.dll
