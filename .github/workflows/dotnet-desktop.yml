name: .NET Desktop Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    env:
      Solution_Name: TextToSpeech.sln

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet packages
      run: dotnet restore $env:Solution_Name

    - name: Build the application
      run: msbuild $env:Solution_Name /p:Configuration=Release

    - name: Run tests
      run: dotnet test TextToSpeech.Tests/TextToSpeech.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Test Results
        path: TestResults/*.trx
        if-no-files-found: ignore

    # Upload build artifacts (the built executable files)
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Executable Files
        path: |
          TextToSpeech/bin/Release/**/*
        if-no-files-found: error
